name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aura-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile bot
        run: python -m py_compile main.py
      - name: Verify startup rejects missing token safely
        run: |
          if python main.py 2>startup-error.log; then
            echo "Bot unexpectedly started without a token"
            exit 1
          fi
          grep -q "TELEGRAM_BOT_TOKEN is required" startup-error.log
