name: AURA Commerce CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run store tests
        run: python -m unittest discover -s tests -v
      - name: Verify startup rejects missing token
        run: |
          if python main.py 2>startup-error.log; then
            echo "Bot unexpectedly started without a token"
            exit 1
          fi
          grep -q "TELEGRAM_BOT_TOKEN is missing" startup-error.log
